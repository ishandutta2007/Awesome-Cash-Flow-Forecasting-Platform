<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#102a43"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#00C9FF"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes floatAnim {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes pulseLine {
        0%, 100% { stroke-dashoffset: 0; opacity: 0.9; }
        50% { stroke-dashoffset: 40; opacity: 1; }
      }
      @keyframes beaconPulse {
        0% { r: 5; opacity: 1; }
        50% { r: 14; opacity: 0.2; }
        100% { r: 5; opacity: 1; }
      }
      .floating-card {
        animation: floatAnim 6s ease-in-out infinite;
      }
      .pulse-chart {
        stroke-dasharray: 800;
        stroke-dashoffset: 0;
        animation: pulseLine 8s ease-in-out infinite;
      }
      .beacon {
        animation: beaconPulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .title-text {
        font-family: system-ui, -apple-system, sans-serif;
        font-weight: 800;
      }
      .sub-text {
        font-family: system-ui, -apple-system, sans-serif;
        font-weight: 400;
      }
    </style>
  </defs>

  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16"/>
  <circle cx="150" cy="80" r="180" fill="#00F2FE" opacity="0.08" filter="url(#glow)"/>
  <circle cx="1050" cy="320" r="220" fill="#8B5CF6" opacity="0.09" filter="url(#glow)"/>
  <circle cx="650" cy="180" r="160" fill="#10B981" opacity="0.06" filter="url(#glow)"/>

  <g opacity="0.85">
    <path d="M 50 340 Q 200 310, 350 260 T 650 220 T 900 150 T 1150 110 L 1150 360 L 50 360 Z" fill="url(#chartGrad)"/>
    <path d="M 50 350 Q 200 330, 350 300 T 650 260 T 900 210 T 1150 180" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="6,6" opacity="0.5"/>
    <path class="pulse-chart" d="M 50 340 Q 200 310, 350 260 T 650 220 T 900 150 T 1150 110" fill="none" stroke="url(#primaryGrad)" stroke-width="4.5" filter="url(#softGlow)"/>
    <circle cx="350" cy="260" r="5" fill="#00F2FE"/>
    <circle cx="650" cy="220" r="5" fill="#00F2FE"/>
    <circle cx="900" cy="150" r="6" fill="#34D399"/>
    <circle class="beacon" cx="1150" cy="110" r="6" fill="#00F2FE"/>
    <circle cx="1150" cy="110" r="4.5" fill="#FFFFFF"/>
  </g>

  <g transform="translate(60, 50)">
    <g transform="translate(0, 20)">
      <rect width="270" height="32" rx="16" fill="#1E293B" stroke="#38BDF8" stroke-width="1" opacity="0.9"/>
      <circle cx="16" cy="16" r="5" fill="#10B981"/>
      <text x="32" y="21" class="sub-text" font-size="13" font-weight="600" fill="#38BDF8" letter-spacing="0.5">CURATED ECOSYSTEM 2026</text>
    </g>
    <text x="0" y="110" class="title-text" font-size="46" fill="#FFFFFF" letter-spacing="-0.5">Awesome Cash Flow</text>
    <text x="0" y="162" class="title-text" font-size="46" fill="url(#primaryGrad)" letter-spacing="-0.5">Forecasting Platforms</text>
    <text x="0" y="210" class="sub-text" font-size="17" fill="#94A3B8">SaaS Suites &#8226; Open-Source Engines &#8226; Treasury Intelligence &#8226; Scenario Modeling</text>
    <g transform="translate(0, 250)">
      <rect x="0" y="0" width="135" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="14" y="22" class="sub-text" font-size="13" fill="#E2E8F0">💰 Cash Visibility</text>
      <rect x="147" y="0" width="155" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="159" y="22" class="sub-text" font-size="13" fill="#E2E8F0">📈 13-Week Forecast</text>
      <rect x="314" y="0" width="150" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="326" y="22" class="sub-text" font-size="13" fill="#E2E8F0">🔮 Scenario Engine</text>
      <rect x="476" y="0" width="145" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="488" y="22" class="sub-text" font-size="13" fill="#E2E8F0">⚡ AI &amp; Time-Series</text>
    </g>
  </g>

  <g class="floating-card" transform="translate(830, 60)">
    <rect width="310" height="240" rx="14" fill="#111C2E" stroke="#1E3A5F" stroke-width="1.5" filter="url(#glow)"/>
    <rect width="310" height="42" rx="14" fill="#16253B"/>
    <circle cx="20" cy="21" r="5" fill="#EF4444" opacity="0.8"/>
    <circle cx="36" cy="21" r="5" fill="#F59E0B" opacity="0.8"/>
    <circle cx="52" cy="21" r="5" fill="#10B981" opacity="0.8"/>
    <text x="80" y="26" class="sub-text" font-size="12" fill="#94A3B8" font-weight="600">Liquidity Runway &amp; Forecast</text>
    <g transform="translate(20, 60)">
      <text x="0" y="14" class="sub-text" font-size="11" fill="#64748B">Projected 90-Day Cash</text>
      <text x="0" y="38" class="title-text" font-size="20" fill="#34D399">$2,450,800</text>
      <text x="160" y="38" class="sub-text" font-size="12" fill="#10B981">+18.4% ↑</text>
    </g>
    <g transform="translate(20, 125)">
      <rect x="0" y="45" width="24" height="45" rx="3" fill="#1E293B"/>
      <rect x="0" y="20" width="24" height="25" rx="3" fill="#38BDF8" opacity="0.7"/>
      <text x="3" y="100" class="sub-text" font-size="10" fill="#64748B">W1</text>
      <rect x="38" y="35" width="24" height="55" rx="3" fill="#1E293B"/>
      <rect x="38" y="15" width="24" height="20" rx="3" fill="#38BDF8" opacity="0.8"/>
      <text x="41" y="100" class="sub-text" font-size="10" fill="#64748B">W4</text>
      <rect x="76" y="25" width="24" height="65" rx="3" fill="#1E293B"/>
      <rect x="76" y="5" width="24" height="20" rx="3" fill="#00F2FE"/>
      <text x="79" y="100" class="sub-text" font-size="10" fill="#64748B">W8</text>
      <rect x="114" y="10" width="24" height="80" rx="3" fill="#1E293B"/>
      <rect x="114" y="0" width="24" height="10" rx="3" fill="#34D399"/>
      <text x="115" y="100" class="sub-text" font-size="10" fill="#64748B">W13</text>
      <rect x="160" y="10" width="110" height="70" rx="8" fill="#16253B" stroke="#334155" stroke-width="1"/>
      <text x="170" y="30" class="sub-text" font-size="10" fill="#94A3B8">Runway Horizon</text>
      <text x="170" y="52" class="title-text" font-size="16" fill="#FBBF24">18.5 Mos</text>
      <text x="170" y="68" class="sub-text" font-size="9" fill="#10B981">● Low Risk</text>
    </g>
  </g>
</svg>
